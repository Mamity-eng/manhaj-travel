<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <link rel="shortcut icon" href="/homepage/images/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    
    <link rel="stylesheet" href="./flight.css" />
</head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="/homepage/index.html"
            ><img
              src="/homepage/images/imagelogo.png"
              height="90px"
              class="weblogo"
              alt=""
          /></a>
        </div>

        <div>
            <i class="fa-solid fa-globe"></i>
            www.manhajtravels.com
        </div>

        
      </div>
    </header>
    <section>
        <div>
            <h1>FLIGHT BOOKING CONFIRMATION</h1>
            <p>------   <i class="fa-solid fa-plane plane-left"></i>   -----</p>
            <p>Your flight has been successfully booked with Manhaj Travel and Tours. <br>Thank you for choosing to travel with us!</p>
        </div>
        <div>
            <div>
                <p>BOOKING REFERENCE</p>
            </div>
            <div>
                <p>MNJ-2026-00125</p>
            </div>
        </div>
    </section>
<section>
    <div class="flightinfo">
        <div>
            <div class="icon">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <p>PASSENGER NAME <b>:</b> <p class="passengerName"></p></p>
            </div>
        </div>
        <hr>
        <div>
            <div class="icon">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div>
                <p>EMAIL <b>:</b> <p class="passengerEmail"></p></p>
            </div>
        </div>
        <hr>
        <div>
            <div class="icon">
                <i class="fa-solid fa-phone"></i>
            </div>
            <div>
                <p>PHONE <b>:</b> <p class="passengerPhone"></p></p>
            </div>
        </div>
        <hr>
        <div>
            <div class="icon">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <div>
                <p>FROM <b>:</b> <p class="countryFrom"></p></p>
            </div>
        </div>
        <hr>
        <div>
            <div class="icon">
                <i class="fa-solid fa-plane-arrival"></i>
            </div>
            <div>
                <p>TO <b>:</b> <p class="countryTo"></p></p>
            </div>
        </div>
        <hr>
        <div>
            <div class="icon">
                <i class="fa-solid fa-calendar"></i>
            </div>
            <div>
                <p>DEPARTURE DATE <b>:</b> <p class="countryDepart"></p></p>
            </div>
        </div>
        <hr>
        <div>
            <div class="icon">
                <i class="fa-solid fa-calendar-check"></i>
            </div>
            <div>
                <p>ARRIVAL DATE <b>:</b> <p class="countryArrival"></p></p>
            </div>
        </div>
    </div>
    <div>
        <img src="./chat.png" alt="" vspace="100px" height="300px">
    </div>
</section>
<section>
    <button id="printBooking">Print Flight</button>
</section>
</body>
</html>
<script src="./flight.js"></script>
