<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Manhaj travel and tours</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
  <link
    rel="shortcut icon"
    href="/homepage/images/favicon.png"
    type="image/x-icon"
  />
  <style>
    body {
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.829), rgba(0, 0, 0, 0.842)),
        url(https://cdn.worldota.net/t/1024x768/content/2c/df/2cdf7bb5ed10b56978b251903ec8f8f21148f8eb.jpeg);
      background-repeat: no-repeat;
      background-size: cover;
      font-family: "Poppins", sans-serif;
      height: 130vh;
    }
    section form div {
      margin: 0px 0px 30px 0px;
    }
    input {
      width: 90%;
      height: 40px;
      background-color: #fff;
      border: 1px solid gold;
      border-radius: 12px;
      font-family: "Poppins", sans-serif;
      animation: float 1s ease-in;
    }
    input:focus {
      box-shadow: 0 0 10px rgba(0, 119, 225, 0.4);
      outline: none;
    }
    section > img {
      text-align: center;
      margin: 20px 0px 0px 0%;
    }
    section {
      width: 35%;
      height: 650px;
      padding: 20px;
      text-align: center;
      background-image: url(/homepage/images/backgroundimage.png);
      background-repeat: no-repeat;
      background-size: cover;
      border-radius: 10px;
      margin: 50px 0px 0px 30%;
      font-family: "Poppins", sans-serif;
    }
    section > h2 {
      color: rgb(9, 0, 15);
      text-align: center;
      font-weight: 400;
      margin-bottom: -10px;
    }
    section > p {
      font-size: 14px;
      color: rgb(90, 84, 84);
    }
    section > h2 > b {
      color: rgba(161, 138, 5, 0.603);
    }
    button {
      width: 70%;
      border-radius: 5px;
      margin: 25px 0px 0px 0%;
      height: 40px;
      color: white;
      font-family: "Poppins", sans-serif;
      background-color: transparent;
      border: none;
      background-color: #a88412;
    }
    i {
      color: white;
      font-size: 15px;
    }
    button:hover {
      background-color: #a88412;
      transition: 0.2s;
      transform: translateY(-2px);
    }
    
/* Tablets and smaller laptops */
@media screen and (max-width: 900px) {
    section {
        width: 65%;
        height: auto;
        min-height: 650px;
        margin: 40px auto;
        box-sizing: border-box;
    }

    input {
        width: 90%;
        box-sizing: border-box;
    }

    button {
        width: 80%;
    }
}

/* Mobile phones */
@media screen and (max-width: 600px) {
    body {
        min-height: 100vh;
        height: auto;
        padding: 10px;
        box-sizing: border-box;
        background-position: center;
    }

    section {
        width: 100%;
        height: auto;
        min-height: 0;
        margin: 25px auto;
        padding: 20px 12px;
        box-sizing: border-box;
    }

    section > img {
        max-width: 100%;
        height: 65px;
        object-fit: contain;
    }

    section > h2 {
        font-size: 23px;
    }

    section > p {
        font-size: 13px;
    }

    section form div {
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        height: 42px;
        padding: 0 10px;
        box-sizing: border-box;
        font-size: 13px;
    }

    button {
        width: 90%;
        margin: 20px 0 0;
    }
}

/* Very small phones */
@media screen and (max-width: 360px) {
    section {
        padding: 15px 8px;
    }

    section > h2 {
        font-size: 21px;
    }

    input {
        font-size: 12px;
    }

    button {
        width: 95%;
    }
}

  </style>
  <body>
    <a href="/index.html" style="color: white">← Back</a>
    <section>
      <img src="/homepage/images/imagelogo.png" alt="" height="70px" />
      <h2>Create <b>Account</b></h2>
      <p>Join Manhaj Travels and start your Journey today.</p>

      <form action="">
        <!-- <label for="email">Firstname: </label> -->
        <input
          type="text"
          placeholder="Enter your Firstname"
          id="name"
          required
        /><br />
        <div class="first"></div>
        <!-- <label for="Surname">Surname: </label> -->
        <input
          type="text"
          placeholder="Enter your Surname"
          id="name3"
          required
        /><br />
        <div class="first2"></div>
        <!-- <label for="email">Email:  </label> -->
        <input
          type="email"
          placeholder="Enter your Email"
          id="email"
          required
        /><br />
        <div class="second"></div>
        <!-- <label for="password">Password: </label> -->
        <input
          type="password"
          placeholder="Enter your Password"
          id="password"
          required
        /><br />
        <div class="third"></div>
        <!-- <label for="PhoneNumber">Phone number: </label>     -->
        <input
          type="number"
          id="number"
          placeholder="Enter your Phone number"
          required
        /><br />
        <div class="fourth"></div>

        <button type="submit"><i class="fa-solid fa-user"></i> Sign Up</button>
      </form>
      <p>Already have an account? <a href="./login.html">Login</a></p>
    </section>
  </body>
</html>
<script>
  let local = [];
  let form = document.querySelector("form");

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    let pushedLocal = {
      name: form.name.value.trim(),
      name2: form.name3.value.trim(),
      email: form.email.value.trim(),
      password: form.password.value,
      phone: form.number.value,
    };

    let nameRegex = /^[a-zA-Z ]{5,}$/;
    let emailRegex = /^[a-z0-9@.]{15,}$/;
    let passwordRegex = /^[a-zA-Z0-9\W]{8,}$/;
    let numberRegex = /^[0-9+]{9,11}$/;

    let name1 = nameRegex.test(pushedLocal.name);
    let name3 = nameRegex.test(pushedLocal.name2);
    let email = emailRegex.test(pushedLocal.email);
    let password = passwordRegex.test(pushedLocal.password);
    let phoneNumber = numberRegex.test(pushedLocal.phone);

    let first = document.querySelector(".first");
    let first2 = document.querySelector(".first");
    let second = document.querySelector(".second");
    let third = document.querySelector(".third");
    let fourth = document.querySelector(".fourth");

    if (name1 == false) {
      first.innerHTML = "The character must be more than five characters.";
      first.setAttribute("style", "color: red;");
    }
    
    if (name3 == false) {
      first2.innerHTML = "The character must be more than five characters.";
      first2.setAttribute("style", "color: red;");
    }
    

    if (email == false) {
      second.innerHTML = "The character must be more than 15 characters.";
      second.setAttribute("style", "color: red;");
    }

    if (password == false) {
      third.innerHTML = "The character must be more than 8 characters";
      third.setAttribute("style", "color: red;");
    }

    if (phoneNumber == false) {
      fourth.innerHTML = "The character must be more than 11 characters";
      fourth.setAttribute("style", "color: red");
    } else {
      fourth.setAttribute("style", "display: none;");
    }

    if (
      name1 == true &&
      email == true &&
      password == true &&
      phoneNumber == true
    ) {
        
      local.push(pushedLocal);
      localStorage.setItem("currentUser", JSON.stringify(local));
      alert("Your Sign up was successfull");
      window.location.href = "./login.html";
    }
  });
</script>
